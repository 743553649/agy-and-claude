name: CI Build

# 每次 push / PR 都编译一次 standard flavor，产出可安装的 APK artifact。
# 本工作流只做「校验 + 出包」，绝不发布 Release、绝不碰 version.json。
# 发版仍然走 release.yml（仅在 version.json 变更时触发）。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-standard:
    name: Build standard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # release 变体用 release.jks 签名（该文件不入库，由 secret 还原）。
      # secret 缺失时自动退回 debug 变体，保证 CI 不因签名材料缺失而红。
      - name: Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "keystore secret absent -> debug variant"
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > app/release.jks
          echo "keystore restored"

      - name: Build standard APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.jks ]; then
            echo "==> :app:assembleStandardRelease"
            ./gradlew :app:assembleStandardRelease --stacktrace --no-daemon
          else
            echo "==> :app:assembleStandardDebug"
            ./gradlew :app:assembleStandardDebug --stacktrace --no-daemon
          fi

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('version.json')).get('version_name','0.0.0'))")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MODE="release"
          if [ ! -f app/release.jks ]; then MODE="debug"; fi
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "${APK}" ]; then echo "no APK produced"; exit 1; fi
          OUT="artifact/antiGem-standard-v${VERSION_NAME}-${MODE}-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          ls -lh artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiGem-standard-${{ github.sha }}
          path: artifact/*.apk
          retention-days: 14
          if-no-files-found: error
