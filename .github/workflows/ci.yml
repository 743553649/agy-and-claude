name: CI Build

# 每次 push / PR 都编译一次 **termux flavor**（applicationId = com.termux，与上游发版一致），
# 产出可安装的 APK artifact。只做「校验 + 出包」，绝不发布 Release、绝不碰 version.json。
# 发版仍然走 release.yml（仅在 version.json 变更时触发）。
#
# 签名：release.jks 不入库，由仓库 secret RELEASE_KEYSTORE_BASE64 还原。
#   有 secret -> :app:assembleTermuxRelease（release 签名，可覆盖安装官方版本）
#   无 secret -> :app:assembleTermuxDebug（debug 签名，仅用于看界面，不能覆盖官方版本）
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-termux:
    name: Build termux APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次只能产出 debug 签名包，无法覆盖安装官方版本"
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > app/release.jks
          echo "keystore restored"

      # 编译前的快速校验：资源 XML 合法性、R.string 引用完整性、占位符与参数一致性、
      # 非 Composable 误用、英文资源残留 Kotlin 插值。失败 10 秒内暴露，不用等一轮 Gradle。
      - name: Verify i18n resources
        run: python3 scripts/i18n/verify.py

      - name: Build termux APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.jks ]; then
            echo "==> :app:assembleTermuxRelease (release 签名)"
            ./gradlew :app:assembleTermuxRelease --stacktrace --no-daemon
          else
            echo "==> :app:assembleTermuxDebug (debug 签名)"
            ./gradlew :app:assembleTermuxDebug --stacktrace --no-daemon
          fi

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('version.json')).get('version_name','0.0.0'))")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MODE="release"
          if [ ! -f app/release.jks ]; then MODE="debug"; fi
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "${APK}" ]; then echo "no APK produced"; exit 1; fi
          OUT="artifact/antiGem-termux-v${VERSION_NAME}-${MODE}-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          ls -lh artifact
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          echo "- 文件：\`$(basename "$OUT")\`" >> $GITHUB_STEP_SUMMARY
          echo "- 包名：\`com.termux\`（termux flavor）" >> $GITHUB_STEP_SUMMARY
          echo "- 签名：\`${MODE}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiGem-termux-${{ github.sha }}
          path: artifact/*.apk
          retention-days: 14
          if-no-files-found: error
