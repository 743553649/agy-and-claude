name: CI Build

# 每次 push / PR 都编译一次 **termux flavor**（applicationId = com.termux，与上游发版一致），
# 产出可安装的 APK artifact。只做「校验 + 出包」，绝不发布 Release、绝不碰 version.json。
# 发版仍然走 release.yml（仅在 version.json 变更时触发）。
#
# 签名：release.jks 不入库，由仓库 secret RELEASE_KEYSTORE_BASE64 还原。
#   有 secret -> :app:assembleTermuxRelease（release 签名，可覆盖安装官方版本）
#   无 secret -> :app:assembleTermuxDebug（debug 签名，仅用于看界面，不能覆盖官方版本）
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-termux:
    name: Build termux APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 不能低于 agy_ide_bridge/go.mod 的 `go 1.26.5`：低版本 Go 会先拒绝加载模块，
          # 再靠 GOTOOLCHAIN=auto 现场下载 go1.26.5（每次多下约 50MB 且依赖 proxy 可用）。
          # 这里写语言版本 1.26：拿到的是 1.26 最新 patch；万一该 patch <1.26.5，
          # 仍会退回自动切换那条已被 CI 验证过的路径，所以不会比原来更差。
          go-version: '1.26'
          # go.sum 在 agy_ide_bridge/ 下，不在仓库根；不指定会每次 Restore cache failed
          cache-dependency-path: agy_ide_bridge/go.sum

      # gradle/actions 默认只在默认分支写缓存，其它分支只读。本仓库 CI 实际只在
      # feat 分支跑，默认分支 master 从没跑过 → 缓存永远是空，每次都全量重下依赖。
      # 打开写入后，后续 run 能复用 ~/.gradle（含依赖与本地 build cache）。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 注：曾在这里用 actions/cache 缓存项目级 `.gradle`（配置缓存），实测无收益：
      # 缓存能恢复（日志 Cache restored from key: cc-Linux-…），但 Gradle 仍打印
      # "Calculating task graph as no cached configuration is available"。
      # 原因：setup-gradle@v4 每次会注入内容随运行变化的 init script，而 init script
      # 是配置缓存的输入之一 —— 条目键每跑必变，因此永远不命中，这一步只省 1 秒却多一次 restore，属于负收益。
      # 已删除；如需再试，先确认注入的 init script 稳定，否则删了比留着干净。

      - name: Restore Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次只能产出 debug 签名包，无法覆盖安装官方版本"
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > app/release.jks
          echo "keystore restored"

      # 编译前的快速校验：资源 XML 合法性、R.string 引用完整性、占位符与参数一致性、
      # 非 Composable 误用、英文资源残留 Kotlin 插值。失败 10 秒内暴露，不用等一轮 Gradle。
      - name: Verify i18n resources
        run: python3 scripts/i18n/verify.py

      - name: Build termux APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.jks ]; then
            echo "==> :app:assembleTermuxRelease (release 签名)"
            ./gradlew :app:assembleTermuxRelease --stacktrace --no-daemon
          else
            echo "==> :app:assembleTermuxDebug (debug 签名)"
            ./gradlew :app:assembleTermuxDebug --stacktrace --no-daemon
          fi

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('version.json')).get('version_name','0.0.0'))")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MODE="release"
          if [ ! -f app/release.jks ]; then MODE="debug"; fi
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "${APK}" ]; then echo "no APK produced"; exit 1; fi
          OUT="artifact/antiGem-termux-v${VERSION_NAME}-${MODE}-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          ls -lh artifact
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          echo "- 文件：\`$(basename "$OUT")\`" >> $GITHUB_STEP_SUMMARY
          echo "- 包名：\`com.termux\`（termux flavor）" >> $GITHUB_STEP_SUMMARY
          echo "- 签名：\`${MODE}\`" >> $GITHUB_STEP_SUMMARY

      # 签名指纹校验：本项目只允许一把 release 密钥，一旦漂移（例如 secret 失效回退 debug），
      # 装出来的包就覆盖不了旧版。详见 docs/i18n/archive/HANDOFF.md「签名标准」。
      - name: Verify APK signature
        run: |
          APK=$(find artifact -name "*.apk" | head -n 1)
          if [ -f app/release.jks ]; then
            python3 scripts/verify_apk_signature.py "${APK}" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "::warning::本次是 debug 签名，跳过指纹校验（每次 CI 的 debug keystore 都是新生成的，彼此无法覆盖安装）"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antiGem-termux-${{ github.sha }}
          path: artifact/*.apk
          retention-days: 14
          if-no-files-found: error
